[tool.poetry]
name = "salsa-repo"
version = "0.1.0"
description = ""
authors = ["SALSA Authors"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
torch = ">=2.4.0"
transformers = ">=4.55.1"
hydra-core = ">=1.3.2"
omegaconf = ">=2.3.0"
datasets = ">=3.2.0"
wandb = ">=0.19.6"
scikit-learn = ">=1.6.1"
peft = "0.14.0"
loguru = "0.7.3"
numpy = "^2.1"
pandas = "^2.2"
accelerate = ">=1.4.0"
trl = "^0.24.0"

# MoE fast-path: required for rank-synchronized expert routing with DeepSpeed ZeRO-3
causal-conv1d = {version = ">=1.4.0", optional = true}
flash-linear-attention = {version = ">=0.4.0", optional = true}

# Unsloth: optimized training for MoE and transformer models (alternative entry point)
unsloth = {version = ">=2025.3", optional = true}

[tool.poetry.extras]
moe = ["causal-conv1d", "flash-linear-attention"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

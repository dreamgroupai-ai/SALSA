defaults:
  - base_config.yaml
  - _self_  # This ensures the current config is merged properly

logging:
  save_steps:
    eval_step: 100000

output:
  checkpoint_path: "outputs/mnli_checkpoint"


dataset:
  name: ["glue","mnli"]
  test_name: "validation_mismatched"
  val_name: "validation_matched"
  labels: [0,1,2]
  fields:
    text1: "premise"
    text2: "hypothesis"

classifier:
  main_prompt: |
    Given the premise:
    <premise>
    {text1}
    </premise>
    <hypothesis>
    {text2}
    </hypothesis>
    is the hypothesis supported by premise
    provide answer in format:
    <ANSWER>#Number</ANSWER>
    where the number is one of the following:
    0 - entailment
    1 - neutral
    2 - contradiction
  answer_prompt: |
    <ANSWER>{label}</ANSWER>
  options:
    label: ["0", "1", "2"]
  prefix: <ANSWER>
  suffix: </ANSWER>

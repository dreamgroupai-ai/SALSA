defaults:
  - base_config.yaml
  - _self_  # This ensures the current config is merged properly

logging:
  save_steps:
    eval_step: 5000

output:
  checkpoint_path: "outputs/mednli_checkpoint"


dataset:
  name: "presencesw/mednli"
  test_name: "test"
  val_name: "validation"
  labels: ["entailment","neutral","contradiction"]
  fields:
    text1: "sentence1"
    text2: "sentence2"
    label: "gold_label"

classifier:
  main_prompt: |
    Given the premise:
    <premise>
    {text1}
    </premise>
    <hypothesis>
    {text2}
    </hypothesis>
    is the hypothesis supported by premise
    provide answer in format:
    <ANSWER>#Number</ANSWER>
    where the number is one of the following:
    0 - entailment
    1 - neutral
    2 - contradiction
  answer_prompt: |
    <ANSWER>{label}</ANSWER>
  options:
    label: ["0", "1", "2"]
  prefix: <ANSWER>
  suffix: </ANSWER>

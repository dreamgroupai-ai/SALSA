defaults:
  - base_config.yaml
  - _self_  # This ensures the current config is merged properly

training:
  epochs: 12
  gradient_accumulation_steps: 20

logging:
  save_steps:
    eval_step: 200

output:
  checkpoint_path: "outputs/wnli_checkpoint"


dataset:
  name: ["glue", "wnli"]
  test_name: ""
  val_name: "validation"
  labels: [0,1]
  fields:
    text1: "sentence1"
    text2: "sentence2"

classifier:
  main_prompt: |
    Determine whether Sentence2 is entailed by Sentence1 (i.e., whether Sentence1 logically implies Sentence2).
    Given the two sentences:
    <Sentence1>
    {text1}
    </Sentence1>
    <Sentence2>
    {text2}
    </Sentence2>

    provide answer in format:
    <ANSWER>#Number</ANSWER>
    where the number is one of the following:
    0 - No
    1 - Yes
  answer_prompt: |
    <ANSWER>{label}</ANSWER>
  options:
    label: ["0", "1"]
  prefix: <ANSWER>
  suffix: </ANSWER>
